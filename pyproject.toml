[build-system] # `pip wheel .` runs `pyvista-build cvista` (ci/cvista_pep517.py)
requires = ["pyvista-build[tools]==0.2.0", "setuptools_scm>=8"]
build-backend = "cvista_pep517"
backend-path = ["ci"]

[tool.setuptools_scm] # tag `<VTK base>.N` publishes cvista `<VTK base>.N`
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "9.6.2.0.dev0"

[project]
name = "cvista"
version = "9.6.2" # metadata peek only; the wheel carries the real version
description = "cvista — trimmed PyVista-parity hard-fork of VTK 9.6.2 (vtkmodules renamed to top-level cvista)"
requires-python = ">=3.11" # 3.11: its own wheel; 3.12+: one abi3 wheel

[dependency-groups]
build = [
  "pyvista-build[tools]==0.2.0", # `pip install --group build`
]
