# Reusable workflow: build the 3-wheel tier split on all three desktop OSes.
#
# Each job builds the full cvista wheel with `pyvista-build cvista`, then
# partitions the built cvista/ tree into three stackable wheels, cvista (core),
# cvista-rendering and cvista-io, that share the cvista/ import namespace and
# resolve each other's libs via $ORIGIN/@loader_path/.libs RUNPATH. The
# self-containment audit (every tier lib resolves within {own tier} ∪ core) is a
# hard gate; the stacking smoke installs core -> io -> rendering and asserts each
# layer. Each OS uploads a `cvista-tier-wheels-<os>` artifact (3 wheels).
#
# Called by ci.yml (`split`, on-demand) and release-tiers.yml (the publish build).
# The wheel version comes from the git tag via setuptools-scm on a release, or a
# dev version off the branch on a build-only dispatch.
name: _tier-wheels (reusable)

on:
  workflow_call:
    inputs:
      scm_pretend_version:
        description: >-
          Force the wheel version (setuptools-scm pretend). Empty = derive from
          the git tag/history as usual. Used to re-publish tier wheels onto an
          already-tagged release from main without moving the tag.
        type: string
        required: false
        default: ""

jobs:
  linux:
    name: 3-wheel tier split (linux)
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 75
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CVISTA: ${{ inputs.scm_pretend_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Restore ccache seed (cross-run, shared with the full linux leg)
        uses: actions/cache@v4
        with:
          path: /tmp/cvista-ccache
          key: cvista-ccache-linux-tiered-${{ github.run_id }}
          restore-keys: |
            cvista-ccache-linux-tiered-
            cvista-ccache-linux-cp312abi3-
      - name: Install pyvista-build
        run: uv pip install --system --group build "setuptools_scm>=8"
      - name: Build the wheel in the manylinux_2_28 container
        env:
          FORCE_COLOR: "1"
        run: >-
          pyvista-build cvista --defaults ci --manylinux
          --build-dir ${{ runner.temp }}/cvista-build --cache-dir /tmp/cvista-ccache
          --opt gate_o2=1
      - name: Tooling for partition/pack (patchelf, binutils, wheel)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf binutils
          python3 -m pip -q install wheel
      - name: Unpack the wheel + derive version/tag
        id: unpack
        run: |
          set -euo pipefail
          whl=$(ls ${{ runner.temp }}/cvista-build/wheelhouse/cvista-*.whl | head -1)
          echo "built wheel: $whl"
          base=$(basename "$whl" .whl)                     # cvista-9.6.2.0-cp312-abi3-manylinux_2_28_x86_64
          ver=$(echo "$base" | cut -d- -f2)
          tag=$(echo "$base" | cut -d- -f3-)               # cp312-abi3-manylinux_2_28_x86_64
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 -m wheel unpack "$whl" -d /tmp/unpack
          initpy=$(find /tmp/unpack -maxdepth 3 -path '*/cvista/__init__.py' | head -1)
          root=$(dirname "$(dirname "$initpy")")     # wheel root: holds cvista/ + cvista.libs/
          echo "root=$root" >> "$GITHUB_OUTPUT"
          ls -la "$root"
      - name: Partition + self-containment audit (hard gate)
        run: |
          set -euo pipefail
          python3 cvista-config/wheel-split/partition_wheels.py \
            "${{ steps.unpack.outputs.root }}" /tmp/tiers
      - name: Pack 3 tier wheels
        env:
          CVISTA_WHEEL_VERSION: ${{ steps.unpack.outputs.ver }}
          CVISTA_WHEEL_TAG: ${{ steps.unpack.outputs.tag }}
        run: |
          set -euo pipefail
          python3 cvista-config/wheel-split/pack_tier_wheels.py /tmp/tiers /tmp/tier-wheels
          ls -la /tmp/tier-wheels
      - name: Stacking smoke (hard gate, core offline, +io, +rendering)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq libgl1 libglx-mesa0 libxt6 libx11-6 libglu1-mesa || true
          WD=/tmp/tier-wheels PYBIN=python3 bash cvista-config/wheel-split/validate_stacking.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvista-tier-wheels-linux
          path: /tmp/tier-wheels/*.whl
          if-no-files-found: warn

  linux-arm:
    name: 3-wheel tier split (linux aarch64)
    # Native aarch64 full VTK compile; off pull requests, on main / merge_group /
    # dispatch and on a release.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_ARM64 || 'ubuntu-24.04-arm' }}
    timeout-minutes: 120
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CVISTA: ${{ inputs.scm_pretend_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Restore ccache seed (cross-run, arm64 namespace)
        uses: actions/cache@v4
        with:
          path: /tmp/cvista-ccache-arm
          key: cvista-ccache-linux-arm64-tiered-${{ github.run_id }}
          restore-keys: |
            cvista-ccache-linux-arm64-tiered-
            cvista-ccache-linux-arm64-cp312abi3-
      - name: Install pyvista-build
        run: uv pip install --system --group build "setuptools_scm>=8"
      - name: Build the wheel in the manylinux_2_28 aarch64 container
        env:
          FORCE_COLOR: "1"
        run: >-
          pyvista-build cvista --defaults ci --manylinux
          --build-dir ${{ runner.temp }}/cvista-build --cache-dir /tmp/cvista-ccache-arm
          --opt gate_o2=1
      - name: Tooling for partition/pack (patchelf, binutils, wheel)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf binutils
          python3 -m pip -q install wheel
      - name: Unpack the wheel + derive version/tag
        id: unpack
        run: |
          set -euo pipefail
          whl=$(ls ${{ runner.temp }}/cvista-build/wheelhouse/cvista-*.whl | head -1)
          echo "built wheel: $whl"
          base=$(basename "$whl" .whl)
          ver=$(echo "$base" | cut -d- -f2)
          tag=$(echo "$base" | cut -d- -f3-)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 -m wheel unpack "$whl" -d /tmp/unpack
          initpy=$(find /tmp/unpack -maxdepth 3 -path '*/cvista/__init__.py' | head -1)
          root=$(dirname "$(dirname "$initpy")")
          echo "root=$root" >> "$GITHUB_OUTPUT"
          ls -la "$root"
      - name: Partition + self-containment audit (hard gate)
        run: |
          set -euo pipefail
          python3 cvista-config/wheel-split/partition_wheels.py \
            "${{ steps.unpack.outputs.root }}" /tmp/tiers
      - name: Pack 3 tier wheels
        env:
          CVISTA_WHEEL_VERSION: ${{ steps.unpack.outputs.ver }}
          CVISTA_WHEEL_TAG: ${{ steps.unpack.outputs.tag }}
        run: |
          set -euo pipefail
          python3 cvista-config/wheel-split/pack_tier_wheels.py /tmp/tiers /tmp/tier-wheels
          ls -la /tmp/tier-wheels
      - name: Stacking smoke (hard gate, core offline, +io, +rendering)
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq libgl1 libglx-mesa0 libxt6 libx11-6 libglu1-mesa || true
          WD=/tmp/tier-wheels PYBIN=python3 bash cvista-config/wheel-split/validate_stacking.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvista-tier-wheels-linux-arm
          path: /tmp/tier-wheels/*.whl
          if-no-files-found: warn

  macos:
    name: 3-wheel tier split (macOS)
    runs-on: ${{ vars.CVISTA_RUNNER_MACOS || 'macos-14' }}
    timeout-minutes: 90
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CVISTA: ${{ inputs.scm_pretend_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install ccache
        run: brew install ccache
      - name: Restore ccache (cross-run)
        uses: actions/cache@v4
        with:
          path: /tmp/cvista-ccache
          key: cvista-ccache-macos-tiered-${{ github.sha }}
          restore-keys: |
            cvista-ccache-macos-tiered-
            cvista-ccache-macos-14-
      - name: Install pyvista-build
        run: uv pip install --system --group build "setuptools_scm>=8"
      - name: Build the wheel
        env:
          FORCE_COLOR: "1"
        run: >-
          pyvista-build cvista --defaults release --build-dir cvista-build
          --cache-dir /tmp/cvista-ccache
      - name: Partition + pack + stack (otool link graph; delocate .dylibs)
        run: |
          set -euo pipefail
          python -m pip -q install wheel
          whl=$(ls cvista-build/wheelhouse/cvista-*.whl | head -1); echo "built: $whl"
          base=$(basename "$whl" .whl); ver=$(echo "$base"|cut -d- -f2); tag=$(echo "$base"|cut -d- -f3-)
          python -m wheel unpack "$whl" -d /tmp/unpack
          initpy=$(find /tmp/unpack -maxdepth 3 -path '*/cvista/__init__.py' | head -1)
          root=$(dirname "$(dirname "$initpy")")
          ls -la "$root"; ls -la "$root/cvista/.dylibs" 2>/dev/null || true
          python cvista-config/wheel-split/partition_wheels.py "$root" /tmp/tiers
          CVISTA_WHEEL_VERSION="$ver" CVISTA_WHEEL_TAG="$tag" \
            python cvista-config/wheel-split/pack_tier_wheels.py /tmp/tiers /tmp/tier-wheels
          ls -la /tmp/tier-wheels
          WD=/tmp/tier-wheels PYBIN=python bash cvista-config/wheel-split/validate_stacking.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvista-tier-wheels-macos
          path: /tmp/tier-wheels/*.whl
          if-no-files-found: warn

  windows:
    name: 3-wheel tier split (Windows ABI3 build once)
    runs-on: ${{ vars.CVISTA_RUNNER_WINDOWS || 'windows-latest' }}
    timeout-minutes: 120
    env:
      SCCACHE_CACHE_SIZE: "2G"
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CVISTA: ${{ inputs.scm_pretend_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install sccache
        run: choco install sccache -y --no-progress
        shell: pwsh
      - name: Restore the Windows tier compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: cvista-sccache-tiered-windows-abi3-${{ github.sha }}
          restore-keys: cvista-sccache-tiered-windows-abi3-
      - name: Set up MSVC (vcvars) for the Ninja build
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Check stable DLL linking and GIL ownership before the native build
        shell: pwsh
        run: |
          $prefix = python -c "import sys; print(sys.base_prefix)"
          cl /nologo /EHsc /std:c++17 /DPy_LIMITED_API=0x030c0000 /I"$prefix\include" /ICommon/Core /IWrapping/PythonCore ci/check_windows_gil.cxx /Fe:check_windows_gil.exe /link /LIBPATH:"$prefix\libs" python3.lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./check_windows_gil.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pyvista-build
        run: uv pip install --system --group build "setuptools_scm>=8"
      - name: Build the wheel
        shell: bash
        env:
          FORCE_COLOR: "1"
        run: >-
          pyvista-build cvista --defaults release --build-dir cvista-build
          --cache-dir "${{ github.workspace }}/.sccache"
      - name: Partition + pack + audit (pefile link graph; delvewheel cvista.libs)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install wheel pefile
          mkdir -p tier-wheels
          for whl in cvista-build/wheelhouse/cvista-*.whl; do
            echo "built: $whl"
            base=$(basename "$whl" .whl); ver=$(echo "$base"|cut -d- -f2); tag=$(echo "$base"|cut -d- -f3-)
            rm -rf /tmp/unpack /tmp/tiers
            python -m wheel unpack "$whl" -d /tmp/unpack
            initpy=$(find /tmp/unpack -maxdepth 3 -path '*/cvista/__init__.py' | head -1)
            root=$(dirname "$(dirname "$initpy")")
            python cvista-config/wheel-split/partition_wheels.py "$root" /tmp/tiers
            CVISTA_WHEEL_VERSION="$ver" CVISTA_WHEEL_TAG="$tag" \
              python cvista-config/wheel-split/pack_tier_wheels.py /tmp/tiers tier-wheels
          done
          ls -la tier-wheels
      - name: Core import smoke (native)
        shell: pwsh
        run: |
          $core = Get-ChildItem tier-wheels/cvista-*-cp312-abi3-win_amd64.whl | Select-Object -First 1
          if (-not $core) { Write-Error 'core tier wheel not found in tier-wheels/'; exit 1 }
          python -m venv C:\v
          C:\v\Scripts\pip.exe -q install --no-deps $core.FullName
          C:\v\Scripts\python.exe -c "import cvista; from cvista.vtkFiltersSources import vtkSphereSource; s=vtkSphereSource(); s.Update(); print('win core import OK, pts:', s.GetOutput().GetNumberOfPoints())"
          if ($LASTEXITCODE -ne 0) { Write-Error 'core import/compute failed'; exit 1 }
          C:\v\Scripts\python.exe -c "import cvista.vtkRenderingCore" 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Error 'vtkRenderingCore present in core-only (unexpected)'; exit 1 }
          Write-Host 'vtkRenderingCore absent in core-only [OK]'
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvista-tier-wheels-windows-abi3
          path: tier-wheels/*.whl
          if-no-files-found: error

  windows-test:
    name: Windows downloaded ABI3 wheels (Python ${{ matrix.python }})
    needs: windows
    runs-on: ${{ vars.CVISTA_RUNNER_WINDOWS || 'windows-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: cvista-tier-wheels-windows-abi3
          path: downloaded-wheels
      - name: Test the same downloaded wheels without rebuilding
        run: python ci/test_downloaded_windows_wheels.py downloaded-wheels

  # ── Legacy version-specific tiers (cp311) ──────────────────────────
  # Python 3.11 needs version-specific wheels (--opt abi3=0), tiered into the
  # same three projects and uploaded as cvista-tier-wheels-<os>-legacy.
  linux-legacy:
    name: 3-wheel tier split (linux cp311, glibc 2.28)
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 150
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CVISTA: ${{ inputs.scm_pretend_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Restore Python 3.11 compiler cache
        uses: actions/cache@v4
        with:
          path: /tmp/cvista-ccache
          key: cvista-ccache-linux-cp311-manylinux228-${{ github.run_id }}
          restore-keys: |
            cvista-ccache-linux-cp311-manylinux228-
      - name: Install pyvista-build
        run: uv pip install --system --group build "setuptools_scm>=8"
      - name: Build the Python 3.11 wheel in the manylinux_2_28 container
        env:
          FORCE_COLOR: "1"
        run: >-
          pyvista-build cvista --defaults release --manylinux
          --build-dir ${{ runner.temp }}/cvista-build --cache-dir /tmp/cvista-ccache
          --opt abi3=0
      - name: Check Python 3.11 byte-exact parity against stock VTK
        run: BITEXACT_ABI3=0 ci/run-bitexact.sh ${{ runner.temp }}/cvista-build/wheelhouse python
      - name: Tooling for partition/pack (patchelf, binutils, wheel)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf binutils
          python3 -m pip -q install wheel
      - name: Partition + pack each legacy wheel into 3 tiers (audit is the gate)
        run: |
          set -euo pipefail
          mkdir -p /tmp/tier-wheels
          for whl in ${{ runner.temp }}/cvista-build/wheelhouse/cvista-*.whl; do
            echo "=== tiering $whl ==="
            base=$(basename "$whl" .whl)
            ver=$(echo "$base" | cut -d- -f2)
            tag=$(echo "$base" | cut -d- -f3-)
            rm -rf /tmp/unpack /tmp/tiers
            python3 -m wheel unpack "$whl" -d /tmp/unpack
            initpy=$(find /tmp/unpack -maxdepth 3 -path '*/cvista/__init__.py' | head -1)
            root=$(dirname "$(dirname "$initpy")")
            python3 cvista-config/wheel-split/partition_wheels.py "$root" /tmp/tiers
            CVISTA_WHEEL_VERSION="$ver" CVISTA_WHEEL_TAG="$tag" \
              python3 cvista-config/wheel-split/pack_tier_wheels.py /tmp/tiers /tmp/tier-wheels
          done
          ls -la /tmp/tier-wheels
      - name: Validate the Python 3.11 tier wheels
        run: WD=/tmp/tier-wheels PYBIN=python bash cvista-config/wheel-split/validate_stacking.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvista-tier-wheels-linux-legacy
          path: /tmp/tier-wheels/*.whl
          if-no-files-found: error

  macos-legacy:
    name: 3-wheel tier split (macOS legacy cp311)
    runs-on: ${{ vars.CVISTA_RUNNER_MACOS || 'macos-14' }}
    timeout-minutes: 150
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CVISTA: ${{ inputs.scm_pretend_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install ccache
        run: brew install ccache
      - name: Install pyvista-build
        run: uv pip install --system --group build "setuptools_scm>=8"
      - name: Build the Python 3.11 wheel
        env:
          FORCE_COLOR: "1"
        run: >-
          pyvista-build cvista --defaults release --build-dir cvista-build
          --cache-dir /tmp/cvista-ccache --opt abi3=0
      - name: Partition + pack each legacy wheel into 3 tiers (audit is the gate)
        run: |
          set -euo pipefail
          python -m pip -q install wheel
          mkdir -p /tmp/tier-wheels
          for whl in cvista-build/wheelhouse/cvista-*.whl; do
            echo "=== tiering $whl ==="
            base=$(basename "$whl" .whl); ver=$(echo "$base"|cut -d- -f2); tag=$(echo "$base"|cut -d- -f3-)
            rm -rf /tmp/unpack /tmp/tiers
            python -m wheel unpack "$whl" -d /tmp/unpack
            initpy=$(find /tmp/unpack -maxdepth 3 -path '*/cvista/__init__.py' | head -1)
            root=$(dirname "$(dirname "$initpy")")
            python cvista-config/wheel-split/partition_wheels.py "$root" /tmp/tiers
            CVISTA_WHEEL_VERSION="$ver" CVISTA_WHEEL_TAG="$tag" \
              python cvista-config/wheel-split/pack_tier_wheels.py /tmp/tiers /tmp/tier-wheels
          done
          ls -la /tmp/tier-wheels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvista-tier-wheels-macos-legacy
          path: /tmp/tier-wheels/*.whl
          if-no-files-found: error

  windows-legacy:
    name: 3-wheel tier split (Windows ${{ matrix.tag }})
    runs-on: ${{ vars.CVISTA_RUNNER_WINDOWS || 'windows-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cp311
            python: '3.11'
    env:
      SCCACHE_CACHE_SIZE: "2G"
      SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CVISTA: ${{ inputs.scm_pretend_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install sccache
        run: choco install sccache -y --no-progress
        shell: pwsh
      - name: Restore the Windows tier compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: cvista-sccache-tiered-windows-${{ matrix.tag }}-${{ github.sha }}
          restore-keys: cvista-sccache-tiered-windows-${{ matrix.tag }}-
      - name: Set up MSVC (vcvars) for the Ninja build
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install pyvista-build
        run: uv pip install --system --group build "setuptools_scm>=8"
      - name: Build the ${{ matrix.tag }} wheel
        shell: bash
        env:
          FORCE_COLOR: "1"
        run: >-
          pyvista-build cvista --defaults release --build-dir cvista-build
          --cache-dir "${{ github.workspace }}/.sccache" --opt abi3=0
      - name: Audit the Python DLL imports
        shell: bash
        run: |
          python -m pip -q install pefile
          python ci/test_downloaded_windows_wheels.py audit cvista-build/wheelhouse/*.whl
      - name: Partition + pack each legacy wheel into 3 tiers (audit is the gate)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip -q install wheel pefile
          mkdir -p tier-wheels
          for whl in cvista-build/wheelhouse/cvista-*.whl; do
            echo "=== tiering $whl ==="
            base=$(basename "$whl" .whl); ver=$(echo "$base"|cut -d- -f2); tag=$(echo "$base"|cut -d- -f3-)
            rm -rf /tmp/unpack /tmp/tiers
            python -m wheel unpack "$whl" -d /tmp/unpack
            initpy=$(find /tmp/unpack -maxdepth 3 -path '*/cvista/__init__.py' | head -1)
            root=$(dirname "$(dirname "$initpy")")
            python cvista-config/wheel-split/partition_wheels.py "$root" /tmp/tiers
            CVISTA_WHEEL_VERSION="$ver" CVISTA_WHEEL_TAG="$tag" \
              python cvista-config/wheel-split/pack_tier_wheels.py /tmp/tiers tier-wheels
          done
          ls -la tier-wheels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
