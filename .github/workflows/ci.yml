# CI gate: runs on every PR to main and on every push to main. Every wheel is built
# by `pyvista-build cvista` from pyvista-build.toml. Jobs:
#
#   build (linux)   : the single cp312-abi3 wheel in the manylinux_2_28 container
#              (pyvista-build --manylinux), LTO off and -O2 for a fast bit-exact
#              gate, then the offscreen render smoke. Uploads
#              cvista-wheels-linux-cp312abi3.
#   build-other-os  : the same wheel natively on macOS and Windows on every PR, so
#              an AppleClang/MSVC build break never lands on main. Uploads
#              cvista-wheels-<os>.
#   bitexact / renderexact / regression : install the Linux wheel next to stock
#              vtk==9.6.2 and assert byte-identical arrays, pixel-identical
#              framebuffers, and cvista's own behaviour. Linux-only (stock vtk
#              9.6.2 only ships Linux wheels).
#   build-lto / bitexact-lto / renderexact-lto : main-only legs that rebuild the
#              Linux wheel in the shipped config (LTO + -O3) and re-run the gates.
#   build-arm       : main-only aarch64 build of the shipped config.
#   pyvista / pyvista-flat : PyVista's own suite against the wheel.
#
# Publishing lives in release-tiers.yml, which builds the three tier wheels
# (cvista / cvista-rendering / cvista-io) through _tier-wheels.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` so adding `pyvista-full` to an already-open PR fires the gate.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build cp312-abi3 (manylinux_2_28)
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Restore ccache seed (cross-run)
        uses: actions/cache@v4
        with:
          path: /tmp/cvista-ccache
          key: cvista-ccache-linux-cp312abi3-${{ github.run_id }}
          restore-keys: |
            cvista-ccache-linux-cp312abi3-
      - name: Install pyvista-build
        run: uv pip install --system --group build
      - name: Hook and manifest tests
        run: python -m unittest discover -s ci -p test_pyvista_build_hooks.py
      - name: Build the wheel in the manylinux_2_28 container
        env:
          FORCE_COLOR: "1"
        run: >-
          pyvista-build cvista --manylinux --yes --source .
          --build-dir ${{ runner.temp }}/cvista-build --cache-dir /tmp/cvista-ccache
          --opt lto=0 --opt gate_o2=1
      - name: Install Xvfb + Mesa software GL (llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6 libxcb1
      - name: Offscreen render smoke
        run: |
          uv pip install --system --no-deps ${{ runner.temp }}/cvista-build/wheelhouse/*.whl
          CVISTA_IMPORT_NAME=cvista xvfb-run -a -s '-screen 0 1280x1024x24' python ci/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: cvista-wheels-linux-cp312abi3
          path: ${{ runner.temp }}/cvista-build/wheelhouse/*.whl
          if-no-files-found: error

  # Build + partition + pack + stack-validate the three tier wheels on every OS
  # through the reusable workflow release-tiers.yml also calls. Heavy, so only on
  # dispatch or with the `wheel-split` label.
  split:
    name: 3-wheel tier split
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'wheel-split')
    uses: ./.github/workflows/_tier-wheels.yml

  build-other-os:
    name: build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            runner: ${{ vars.CVISTA_RUNNER_MACOS || 'macos-14' }}
            # ThinLTO is cheap and this leg has a cross-run ccache; keep it on.
            lto: "1"
          - os: windows-latest
            runner: ${{ vars.CVISTA_RUNNER_WINDOWS || 'windows-latest' }}
            # MSVC /GL+/LTCG dominates the from-scratch build and no cache helps a
            # link-time pass; this leg only proves the wheel builds and imports.
            lto: "0"
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 180 || 90 }}
    env:
      SCCACHE_CACHE_SIZE: "2G"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache
      - name: Restore ccache (cross-run)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: /tmp/cvista-ccache
          key: cvista-ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: cvista-ccache-${{ matrix.os }}-
      # Put MSVC (cl.exe) and the Windows SDK on PATH; ci/cmake/windows.cmake pins
      # CMAKE_CXX_COMPILER=cl.
      - name: Set up MSVC (vcvars) for the Ninja build
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install sccache (Windows)
        if: runner.os == 'Windows'
        run: choco install sccache -y --no-progress
        shell: pwsh
      - name: Restore sccache (Windows, cross-run)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: cvista-sccache-windows-${{ github.sha }}
          restore-keys: cvista-sccache-windows-
      - name: Install pyvista-build
        run: uv pip install --system --group build
      - name: Build the wheel
        shell: bash
        env:
          FORCE_COLOR: "1"
          CACHE_DIR: ${{ runner.os == 'Windows' && format('{0}/.sccache', github.workspace) || '/tmp/cvista-ccache' }}
        run: >-
          pyvista-build cvista --yes --source . --build-dir cvista-build
          --cache-dir "$CACHE_DIR" --opt lto=${{ matrix.lto }}
      - name: Import and compute smoke
        shell: bash
        run: |
          uv pip install --system --no-deps cvista-build/wheelhouse/*.whl
          CVISTA_IMPORT_NAME=cvista python ci/smoke_min.py
      - uses: actions/upload-artifact@v4
        with:
          name: cvista-wheels-${{ matrix.os }}
          path: cvista-build/wheelhouse/*.whl
          if-no-files-found: error

  bitexact:
    name: cvista == stock VTK 9.6.2 (bit-exact, py${{ matrix.python }})
    needs: build
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both pythons install the one cp312-abi3 wheel.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cvista-wheels-linux-*
          merge-multiple: true
          path: dist
      - name: Bit-exact suite (cvista vs stock VTK 9.6.2)
        env:
          BITEXACT_ABI3: "1"
        run: ci/run-bitexact.sh dist python
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bitexact-output-py${{ matrix.python }}
          path: /tmp/bx-out
          if-no-files-found: ignore

  regression:
    name: cvista behavior regressions (py${{ matrix.python }})
    needs: build
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Mesa software GL/EGL (llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6 libxcb1
      - uses: actions/download-artifact@v4
        with:
          pattern: cvista-wheels-linux-*
          merge-multiple: true
          path: dist
      - name: Behavior regression suite (built cvista wheel)
        run: ci/run-regression.sh dist python

  renderexact:
    name: cvista == stock VTK 9.6.2 (pixel-exact render, py${{ matrix.python }})
    needs: build
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Mesa software GL/EGL (llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6 libxcb1
      - uses: actions/download-artifact@v4
        with:
          pattern: cvista-wheels-linux-*
          merge-multiple: true
          path: dist
      - name: Pixel-exact render suite (cvista vs stock VTK 9.6.2, software EGL)
        run: ci/run-renderexact.sh dist python
      - name: Upload render diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renderexact-output-py${{ matrix.python }}
          path: /tmp/rx-out
          if-no-files-found: ignore

  # Cheap detector so a PR that bumps the pin (tests/pyvista/PYVISTA_REF) runs the
  # PyVista gate without needing the `pyvista-full` label.
  changes:
    name: detect PyVista-related changes
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      pyvista_ref: ${{ steps.f.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: f
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The pin, the deselect list, the harness, or anything that shapes the
          # Python namespace PyVista imports through: the wrapping, the wheel
          # split, the shim.
          changed=false
          if [ "$EVENT" = "pull_request" ] && \
             git diff --name-only "$BASE" "$HEAD" | grep -qE '^(tests/pyvista/|ci/run-pyvista\.sh$|Wrapping/Python/|cvista-config/wheel-split/|tools/cvista_shim\.py$)'; then
            changed=true
          fi
          echo "PyVista-related files changed on this PR: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  pyvista-flat:
    name: PyVista via the flat namespace (py3.13)
    needs: [build, changes]
    # The flat namespace is what `from cvista import X` uses; the shim gate never
    # consults the index. Core only, minutes rather than 45.
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.pyvista_ref == 'true')
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CVISTA_PYVISTA_MODE: flat
      PYVISTA_FLAT_CORE_ONLY: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Xvfb + Mesa software GL (llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6 libxcb1
      - uses: actions/download-artifact@v4
        with:
          pattern: cvista-wheels-linux-*
          merge-multiple: true
          path: dist
      - name: PyVista core suite through the flat namespace
        run: ci/run-pyvista.sh dist python

  pyvista:
    name: PyVista suite (built cvista wheel, py3.13)
    needs: [build, changes]
    # PyVista's own full suite driving cvista through the vtkmodules->cvista shim.
    # Heavy, so off the PR fast path: the merge queue, manual dispatch, the
    # `pyvista-full` label, or a pin bump.
    if: >-
      github.event_name == 'merge_group' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
        (contains(github.event.pull_request.labels.*.name, 'pyvista-full') ||
         needs.changes.outputs.pyvista_ref == 'true'))
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Xvfb + Mesa software GL (llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libgles2 libosmesa6 libxcb1
      - uses: actions/download-artifact@v4
        with:
          pattern: cvista-wheels-linux-*
          merge-multiple: true
          path: dist
      - name: PyVista suite (pinned ref, vtkmodules->cvista shim)
        run: ci/run-pyvista.sh dist python
      - name: Upload pytest logs + junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyvista-output
          path: /tmp/pv-out
          if-no-files-found: ignore

  # Single stable required check for the PyVista gate: passes when the suite
  # succeeded or was skipped, fails only when it ran and failed.
  pyvista-gate:
    name: PyVista gate
    needs: pyvista
    if: ${{ always() }}
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    steps:
      - name: Require the PyVista suite to pass or be skipped
        run: |
          r='${{ needs.pyvista.result }}'
          echo "pyvista suite result: $r"
          if [ "$r" = success ] || [ "$r" = skipped ]; then
            echo "PyVista gate OK ($r)"
          else
            echo "::error::PyVista suite $r"
            exit 1
          fi

  # === LTO-on-main legs (push-to-main / workflow_dispatch only) ==============
  # The PR gate builds the fast Linux wheel (LTO off, -O2); these legs rebuild the
  # wheel exactly as shipped (LTO + -O3) and re-run both gates on every merge.
  build-lto:
    name: build cp312-abi3 LTO (manylinux_2_28, main only)
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # A separate ccache namespace: LTO objects must never poison the fast seed.
      - name: Restore ccache seed (cross-run, LTO namespace)
        uses: actions/cache@v4
        with:
          path: /tmp/cvista-ccache-lto
          key: cvista-ccache-linux-cp312abi3-lto-${{ github.run_id }}
          restore-keys: |
            cvista-ccache-linux-cp312abi3-lto-
      - name: Install pyvista-build
        run: uv pip install --system --group build
      - name: Build the LTO wheel in the manylinux_2_28 container
        env:
          FORCE_COLOR: "1"
        run: >-
          pyvista-build cvista --manylinux --yes --source .
          --build-dir ${{ runner.temp }}/cvista-build --cache-dir /tmp/cvista-ccache-lto
      - name: Install Xvfb + Mesa software GL (llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6 libxcb1
      - name: Offscreen render smoke
        run: |
          uv pip install --system --no-deps ${{ runner.temp }}/cvista-build/wheelhouse/*.whl
          CVISTA_IMPORT_NAME=cvista xvfb-run -a -s '-screen 0 1280x1024x24' python ci/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          # A distinct prefix so the non-LTO gates never pick up this wheel.
          name: cvista-wheels-lto-linux-cp312abi3
          path: ${{ runner.temp }}/cvista-build/wheelhouse/*.whl
          if-no-files-found: error

  bitexact-lto:
    name: cvista == stock VTK 9.6.2 (bit-exact LTO, py${{ matrix.python }})
    if: github.event_name != 'pull_request'
    needs: build-lto
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          pattern: cvista-wheels-lto-linux-*
          merge-multiple: true
          path: dist
      - name: Bit-exact suite (LTO wheel vs stock VTK 9.6.2)
        env:
          BITEXACT_ABI3: "1"
        run: ci/run-bitexact.sh dist python
      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bitexact-lto-output-py${{ matrix.python }}
          path: /tmp/bx-out
          if-no-files-found: ignore

  renderexact-lto:
    name: cvista == stock VTK 9.6.2 (pixel-exact render LTO, py${{ matrix.python }})
    if: github.event_name != 'pull_request'
    needs: build-lto
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_SMALL || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Mesa software GL/EGL (llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6 libxcb1
      - uses: actions/download-artifact@v4
        with:
          pattern: cvista-wheels-lto-linux-*
          merge-multiple: true
          path: dist
      - name: Pixel-exact render suite (LTO wheel vs stock VTK 9.6.2, software EGL)
        run: ci/run-renderexact.sh dist python
      - name: Upload render diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: renderexact-lto-output-py${{ matrix.python }}
          path: /tmp/rx-out
          if-no-files-found: ignore

  # === Linux aarch64 build validation (main / merge_group only) ==============
  # Native aarch64 build of the shipped config in the manylinux_2_28 aarch64
  # container (pyvista-build picks the image from the runner's architecture).
  # The aarch64 tier wheels that ship are built by release-tiers.yml.
  build-arm:
    name: build cp312-abi3 (manylinux_2_28 aarch64)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ vars.CVISTA_RUNNER_LINUX_ARM64 || 'ubuntu-24.04-arm' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Restore ccache seed (cross-run, arm64 namespace)
        uses: actions/cache@v4
        with:
          path: /tmp/cvista-ccache-arm
          key: cvista-ccache-linux-arm64-cp312abi3-${{ github.run_id }}
          restore-keys: |
            cvista-ccache-linux-arm64-cp312abi3-
      - name: Install pyvista-build
        run: uv pip install --system --group build
      - name: Build the wheel in the manylinux_2_28 aarch64 container
        env:
          FORCE_COLOR: "1"
        run: >-
          pyvista-build cvista --manylinux --yes --source .
          --build-dir ${{ runner.temp }}/cvista-build --cache-dir /tmp/cvista-ccache-arm
          --opt lto=0 --opt gate_o2=1
      - name: Install Xvfb + Mesa software GL (llvmpipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libegl1 libgl1-mesa-dri libglx-mesa0 libgles2 libosmesa6 libxcb1
      - name: Offscreen render smoke
        run: |
          uv pip install --system --no-deps ${{ runner.temp }}/cvista-build/wheelhouse/*.whl
          CVISTA_IMPORT_NAME=cvista xvfb-run -a -s '-screen 0 1280x1024x24' python ci/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: cvista-wheels-linux-arm64-cp312abi3
          path: ${{ runner.temp }}/cvista-build/wheelhouse/*.whl
          if-no-files-found: error
